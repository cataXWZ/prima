name: Discovery discovery
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
env:
  SUITE_EXECUTION_GROUP: github-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 'suites/prim'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'suites/prim/package-lock.json'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify reviewed source, inventory, UI, API and UI/API
        run: node --import tsx support/discovery/runner.ts all
      - name: Preserve execution evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            suites/prim/reports/discovery/
            suites/prim/test-results/discovery/
          if-no-files-found: error
          retention-days: 14
